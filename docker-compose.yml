services:
  postgres:
    image: pgvector/pgvector:pg16  # Postgres 16 + the pgvector extension
    environment:
      POSTGRES_USER: sivg
      POSTGRES_PASSWORD: sivg
      POSTGRES_DB: sivg
    ports: ["5433:5432"]   # 5433 to avoid clashing with a local Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sivg"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]   # 6380 to avoid clashing with a local Redis
volumes:
  pgdata:
