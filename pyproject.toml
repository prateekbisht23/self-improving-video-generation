[project]
name = "sivg"
version = "0.1.0"
description = "Self-improving multimodal video editing agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "rq>=2.0",
  "langchain>=0.3",
  "langchain-ollama>=0.2",
  "langgraph>=0.2",
  "langsmith>=0.2",
  "scenedetect[opencv]>=0.6.4",
  "faster-whisper>=1.1",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-dotenv>=1.2.4",
  "langchain-google-genai>=4.5.2",
  "pgvector>=0.5.1",
  "python-multipart>=0.0.34",
  "jiwer>=4.0.0",
  "langgraph-checkpoint-postgres>=3.2.1",
  "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "perception", "editing", "agent", "benchmarks", "services", "db"]

[tool.ruff]
line-length = 120
extend-exclude = ["db/migrations/versions"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs models or network"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]
